<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Poe AI Chat">
  <title>Poe AI Chat</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#064e5a"/>
      <stop offset="50%"  stop-color="#10a37f"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.30" cy="0.18" r="0.75">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 圆角底 + 柔光（用 mask 裁切，避免 clip-path 兼容问题） -->
  <mask id="roundMask">
    <path fill="#ffffff" d="M 113 0 H 399 A 113 113 0 0 1 512 113 V 399 A 113 113 0 0 1 399 512 H 113 A 113 113 0 0 1 0 399 V 113 A 113 113 0 0 1 113 0 Z"/>
  </mask>
  <g mask="url(#roundMask)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
  </g>

  <!-- 对话气泡 + 左下尾巴 -->
  <path fill="#ffffff" d="
    M 168 148
    H 344
    A 51 51 0 0 1 395 199
    V 292
    A 51 51 0 0 1 344 343
    H 220
    L 188 388
    L 196 343
    H 168
    A 51 51 0 0 1 117 292
    V 199
    A 51 51 0 0 1 168 148
    Z"/>

  <!-- 三个节点 + 连线（多个 AI 模型互通） -->
  <g stroke="#10a37f" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M 197 251 L 256 228"/>
    <path d="M 256 228 L 315 271"/>
  </g>
  <g fill="#10a37f">
    <circle cx="197" cy="251" r="16"/>
    <circle cx="256" cy="228" r="20"/>
    <circle cx="315" cy="271" r="16"/>
  </g>

  <!-- AI 星火（四角星） -->
  <path fill="#ffffff" transform="translate(412,376)" d="
    M 0 -50
    Q 0 0 50 0
    Q 0 0 0 50
    Q 0 0 -50 0
    Q 0 0 0 -50
    Z"/>
</svg>
