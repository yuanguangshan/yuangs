<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🕳️ 企鹅地下迷宫 · 企鹅游戏库</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:radial-gradient(900px 500px at 50% -8%, #1a2c56 0%, #0c1428 50%, #070d1c 100%);
    color:#dce7fb; font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:10px 10px 20px;
    -webkit-user-select:none; user-select:none; overflow:hidden; touch-action:none;
  }
  header { display:flex; align-items:center; gap:12px; width:100%; max-width:500px; margin-bottom:8px; }
  .back { color:#7fd4ff; text-decoration:none; font-size:14px; white-space:nowrap; }
  .back:hover { text-decoration:underline; }
  h1 { flex:1; text-align:center; font-size:17px; color:#eef4ff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hud { font-size:13px; color:#93a9d4; white-space:nowrap; }
  .hud b { color:#ffd23f; font-size:15px; }
  .stage { position:relative; line-height:0; }
  canvas {
    display:block; background:#000; border-radius:14px;
    box-shadow:0 0 0 2px rgba(110,150,235,.35), 0 18px 50px rgba(0,0,0,.6);
    max-width:calc(100vw - 20px); max-height:calc(100vh - 150px);
    width:auto; height:auto; image-rendering:pixelated;
    touch-action:none;
  }
  .ov { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(7,12,26,.86); border-radius:14px; padding:18px; text-align:center; }
  .ov.on { display:flex; }
  .ov-icon { font-size:46px; }
  .ov h2 { font-size:23px; margin:8px 0 6px; color:#fff; }
  .ov p { font-size:14px; color:#a9bde0; line-height:1.7; max-width:420px; }
  .ov p b { color:#ffd23f; }
  .ov button { margin-top:16px; background:linear-gradient(180deg,#2fae64,#1e8348); color:#fff;
    border:none; font-size:17px; padding:11px 34px; border-radius:999px; cursor:pointer;
    font-family:inherit; box-shadow:0 6px 18px rgba(30,140,80,.45); }
  .ov button:hover { filter:brightness(1.12); transform:translateY(-1px); }
  .hint { margin-top:9px; font-size:13px; color:#7d93b5; text-align:center; max-width:480px; line-height:1.7; }
  .hint b { color:#bcd4fb; }
  .pad { display:none; width:100%; max-width:500px; justify-content:space-between;
    align-items:center; margin-top:auto; padding-top:10px; }
  .dpad { display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(3,46px); gap:4px; }
  .dpad .up { grid-area:1/2; } .dpad .left { grid-area:2/1; } .dpad .right { grid-area:2/3; } .dpad .down { grid-area:3/2; }
  .pad button { border:1px solid rgba(120,160,240,.5); background:rgba(28,42,80,.85); color:#cfe0ff;
    font-size:19px; border-radius:12px; font-family:inherit; touch-action:none; -webkit-tap-highlight-color:transparent; }
  .pad button.on { background:rgba(70,110,200,.9); }
  .pad-a { width:74px; height:74px; border-radius:50%!important; font-size:24px; font-weight:700; }
  @media (pointer:coarse) { .pad { display:flex; } }
</style>
</head>
<body>
  <header>
    <a class="back" href="../index.html">← 游戏库</a>
    <h1>🕳️ 企鹅地下迷宫</h1>
    <div class="hud">得分 <b id="score">0</b> · 最高 <b id="best">0</b></div>
  </header>
  <div class="stage">
    <canvas id="game" width="480" height="640"></canvas>
    <div id="overlay" class="ov on">
      <div>
        <div class="ov-icon">🕳️</div>
        <h2 id="ovTitle">企鹅地下迷宫</h2>
        <p id="ovText"><b>方向键</b> 走出迷宫找到小鱼，限时挑战，越快分数越高</p>
        <button id="ovBtn">开始游戏</button>
      </div>
    </div>
  </div>
  <p class="hint"><b>方向键</b> 走出迷宫找到小鱼，限时挑战，越快分数越高　<span style="color:#5f74a1">难度 ★★★★☆ · 2D · 迷宫</span></p>
  <div class="pad" id="pad">
    <div class="dpad">
      <button class="up" data-k="ArrowUp">▲</button>
      <button class="left" data-k="ArrowLeft">◀</button>
      <button class="right" data-k="ArrowRight">▶</button>
      <button class="down" data-k="ArrowDown">▼</button>
    </div>
    <button class="pad-a" data-k="Space">A</button>
  </div>
<script>
var CFG = {"hint":"<b>方向键</b> 走出迷宫找到小鱼，限时挑战，越快分数越高","cols":13,"rows":17,"time":50,"fog":true,"cw":480,"ch":640,"sky1":"#0b1030","sky2":"#2a2f66","mtn":"#1a2048","g1":"#2a3358","g2":"#232b4d","fogC":"#1a2044","fogNear":18,"fogFar":66,"f":340,"rail":"#39406b","wall":"#4a5490","wall2":"#3b4478","wallTop":"#8f9cd8","tree":"#1f6f52","deep":"#070d24","id":"g023","name":"企鹅地下迷宫","eng":"maze","kind":"2d"};

'use strict';
var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var W = canvas.width, H = canvas.height;
var elScore = document.getElementById('score');
var elBest = document.getElementById('best');
var overlay = document.getElementById('overlay');
var elTitle = document.getElementById('ovTitle');
var elText = document.getElementById('ovText');
var elBtn = document.getElementById('ovBtn');

var state = 'menu';
var score = 0, best = 0;
try { best = +localStorage.getItem('pg-best-' + CFG.id) || 0; } catch (e) {}
elBest.textContent = best;

function setScore(v) {
  score = v;
  elScore.textContent = v;
  if (v > best) { best = v; elBest.textContent = v; try { localStorage.setItem('pg-best-' + CFG.id, v); } catch (e) {} }
}
function showOverlay(title, html, btn) {
  elTitle.textContent = title;
  elText.innerHTML = html;
  elBtn.textContent = btn || '再来一局';
  overlay.classList.add('on');
}
function hideOverlay() { overlay.classList.remove('on'); }
function gameOver() {
  if (state !== 'playing') return;
  state = 'over';
  beep(180, 0.3, 'sawtooth', 0.07);
  showOverlay('游戏结束', '本局得分 <b>' + score + '</b>　最高 <b>' + best + '</b>', '再来一局');
}
function winGame(msg) {
  if (state !== 'playing') return;
  state = 'over';
  beep(880, 0.1, 'square', 0.05);
  setTimeout(function () { beep(1175, 0.16, 'square', 0.05); }, 120);
  showOverlay(msg || '挑战成功！', '本局得分 <b>' + score + '</b>　最高 <b>' + best + '</b>', '再玩一次');
}

// ---------- input ----------
var keys = {}, pressed = {}, mx = -1, my = -1, mdown = false, clicked = false;
window.addEventListener('keydown', function (e) {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) >= 0) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
});
window.addEventListener('keyup', function (e) { keys[e.code] = false; });
window.addEventListener('blur', function () { keys = {}; mdown = false; });
function toCanvas(e) {
  var r = canvas.getBoundingClientRect();
  var t = e.touches && e.touches[0] ? e.touches[0] : e;
  return { x: (t.clientX - r.left) * W / r.width, y: (t.clientY - r.top) * H / r.height };
}
canvas.addEventListener('mousemove', function (e) { var p = toCanvas(e); mx = p.x; my = p.y; });
canvas.addEventListener('mousedown', function (e) { var p = toCanvas(e); mx = p.x; my = p.y; mdown = true; clicked = true; });
window.addEventListener('mouseup', function () { mdown = false; });
canvas.addEventListener('touchstart', function (e) { e.preventDefault(); var p = toCanvas(e); mx = p.x; my = p.y; mdown = true; clicked = true; }, { passive: false });
canvas.addEventListener('touchmove', function (e) { e.preventDefault(); var p = toCanvas(e); mx = p.x; my = p.y; }, { passive: false });
canvas.addEventListener('touchend', function () { mdown = false; });

// on-screen pad: dispatch synthetic key events so every game works on touch
(function () {
  var pad = document.getElementById('pad');
  if (!pad) return;
  function down(k) { window.dispatchEvent(new KeyboardEvent('keydown', { code: k })); }
  function up(k) { window.dispatchEvent(new KeyboardEvent('keyup', { code: k })); }
  Array.prototype.forEach.call(pad.querySelectorAll('button'), function (b) {
    var k = b.getAttribute('data-k');
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); b.classList.add('on'); down(k); });
    b.addEventListener('pointerup', function (e) { e.preventDefault(); b.classList.remove('on'); up(k); });
    b.addEventListener('pointerleave', function () { b.classList.remove('on'); up(k); });
    b.addEventListener('pointercancel', function () { b.classList.remove('on'); up(k); });
  });
})();

// ---------- audio ----------
var AC = null;
function beep(f, d, type, v) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, AC.currentTime);
    g.gain.setValueAtTime(v || 0.04, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0008, AC.currentTime + (d || 0.08));
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + (d || 0.08));
  } catch (e) {}
}

// ---------- utils ----------
function rnd(a, b) { return a + Math.random() * (b - a); }
function rndi(a, b) { return Math.floor(rnd(a, b + 1)); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawHeart(x, y, s, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, s, s);
  ctx.fillRect(x + s * 2, y, s, s);
  ctx.fillRect(x - s, y + s, s * 4, s);
  ctx.fillRect(x, y + s * 2, s * 2, s);
}
function drawStar(x, y, s, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x - s, y - s * 3, s * 2, s * 7);
  ctx.fillRect(x - s * 3, y - s, s * 7, s * 2);
}

// ---------- pixel penguin sprite ----------
var PENG = [
  '....####....',
  '..########..',
  '.##########.',
  '.##WW##WW##.',
  '.##WB##WB##.',
  '..###OO###..',
  '..########..',
  '.##########.',
  '.#WWWWWWWW#.',
  '.#WWWWWWWW#.',
  '.##########.',
  '..OO....OO..'
];
var PENC = { '#': '#1d2735', 'W': '#f7fbff', 'B': '#12161d', 'O': '#ff9f1c' };
function drawPenguin(x, y, s, o) {
  o = o || {};
  var t = o.t || 0;
  var wad = Math.sin(t * (o.moving ? 11 : 3)) * (o.moving ? 0.13 : 0.04);
  ctx.save();
  ctx.translate(x + 6 * s, y + 6 * s);
  ctx.rotate(wad + (o.rot || 0));
  if (o.flip) ctx.scale(-1, 1);
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  for (var r = 0; r < PENG.length; r++) {
    var row = PENG[r];
    for (var c = 0; c < 12; c++) {
      var ch = row.charAt(c);
      if (ch === '.') continue;
      var col = PENC[ch];
      if (o.tint && col === PENC['#']) col = o.tint;
      ctx.fillStyle = col;
      ctx.fillRect(Math.floor((c - 6) * s), Math.floor((r - 6) * s), Math.ceil(s), Math.ceil(s));
    }
  }
  ctx.restore();
}
function drawFish(x, y, s, color, t) {
  var wig = Math.sin((t || 0) * 7) * s * 0.25;
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.fillRect(-s * 2, -s, s * 3, s * 2);
  ctx.beginPath();
  ctx.moveTo(s, -s);
  ctx.lineTo(s + s * 1.6, -s * 1.5 + wig);
  ctx.lineTo(s + s * 1.6, s * 1.5 + wig);
  ctx.lineTo(s, s);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-s * 1.7, -s * 0.5, s * 0.7, s * 0.7);
  ctx.fillStyle = '#10151c';
  ctx.fillRect(-s * 1.5, -s * 0.3, s * 0.4, s * 0.4);
  ctx.restore();
}
function sky() {
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, CFG.sky1);
  g.addColorStop(1, CFG.sky2);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// ---------- loop ----------
var T = 0, last = 0;
function loop(ts) {
  var dt = Math.min(0.034, (ts - last) / 1000 || 0.016);
  last = ts;
  T += dt;
  if (state === 'playing') update(dt);
  render(T);
  clicked = false;
  for (var k in pressed) pressed[k] = false;
  requestAnimationFrame(loop);
}
elBtn.addEventListener('click', function () { hideOverlay(); start(); });
window.addEventListener('keydown', function (e) {
  if (state !== 'playing' && (e.code === 'Enter' || e.code === 'Space')) { hideOverlay(); start(); }
});


var grid = [], cols = 0, rows = 0, cell = 40, ox = 0, oy = 0;
var pc = 1, pr = 1, tx = 0, ty = 0, moving = false, gx = 1, gy = 1;
var time = 0, level = 1, fade = 0;
function gen() {
  cols = CFG.cols % 2 ? CFG.cols : CFG.cols + 1;
  rows = CFG.rows % 2 ? CFG.rows : CFG.rows + 1;
  cell = Math.floor(Math.min((W - 24) / cols, (H - 96) / rows));
  ox = Math.floor((W - cell * cols) / 2);
  oy = 52 + Math.floor((H - 96 - cell * rows) / 2);
  grid = [];
  for (var r = 0; r < rows; r++) { grid.push([]); for (var c = 0; c < cols; c++) grid[r].push(1); }
  var stack = [[1, 1]];
  grid[1][1] = 0;
  while (stack.length) {
    var cur = stack[stack.length - 1];
    var dirs = [[2, 0], [-2, 0], [0, 2], [0, -2]].sort(function () { return Math.random() - 0.5; });
    var moved = false;
    for (var i = 0; i < 4; i++) {
      var nc = cur[0] + dirs[i][0], nr = cur[1] + dirs[i][1];
      if (nc > 0 && nr > 0 && nc < cols - 1 && nr < rows - 1 && grid[nr][nc] === 1) {
        grid[cur[1] + dirs[i][1] / 2][cur[0] + dirs[i][0] / 2] = 0;
        grid[nr][nc] = 0;
        stack.push([nc, nr]);
        moved = true;
        break;
      }
    }
    if (!moved) stack.pop();
  }
  gx = cols - 2; gy = rows - 2;
  pc = 1; pr = 1; moving = false;
  tx = ox + pc * cell + cell / 2; ty = oy + pr * cell + cell / 2;
}
function start() {
  setScore(0);
  level = 1;
  time = CFG.time;
  gen();
  state = 'playing'; hideOverlay();
}
function nextLevel() {
  level++;
  setScore(score + 50 + Math.floor(time));
  beep(880, 0.08);
  setTimeout(function () { beep(1175, 0.12); }, 100);
  time = Math.max(18, CFG.time - (level - 1) * 5);
  gen();
}
function walkable(c, r) { return c >= 0 && r >= 0 && c < cols && r < rows && grid[r][c] === 0; }
function update(dt) {
  time -= dt;
  if (time <= 0) { time = 0; gameOver(); return; }
  if (moving) {
    tx = ox + pc * cell + cell / 2; ty = oy + pr * cell + cell / 2;
    var k = Math.min(1, dt * 15);
    mxp += (tx - mxp) * k; myp += (ty - myp) * k;
    if (Math.abs(mxp - tx) < 1.5 && Math.abs(myp - ty) < 1.5) { mxp = tx; myp = ty; moving = false; }
  } else {
    mxp = tx; myp = ty;
    var dc = 0, dr = 0;
    if (keys['ArrowLeft']) dc = -1;
    else if (keys['ArrowRight']) dc = 1;
    else if (keys['ArrowUp']) dr = -1;
    else if (keys['ArrowDown']) dr = 1;
    if ((dc || dr) && walkable(pc + dc, pr + dr)) { pc += dc; pr += dr; moving = true; beep(240 + (pc + pr) % 3 * 60, 0.03, 'sine', 0.02); }
  }
  if (pc === gx && pr === gy && !moving) nextLevel();
}
var mxp = 0, myp = 0;
function render(t) {
  ctx.fillStyle = '#0d1526';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#16233c';
  ctx.fillRect(0, oy - 6, W, rows * cell + 12);
  for (var r = 0; r < rows; r++) {
    for (var c = 0; c < cols; c++) {
      var x = ox + c * cell, y = oy + r * cell;
      if (grid[r][c] === 1) {
        ctx.fillStyle = (r + c) % 2 ? '#8fd0f2' : '#a6dcf7';
        ctx.fillRect(x + 1, y + 1, cell - 2, cell - 2);
        ctx.fillStyle = 'rgba(255,255,255,.6)';
        ctx.fillRect(x + 4, y + 4, cell - 8, 4);
      } else {
        ctx.fillStyle = (r + c) % 2 ? '#1d2c4a' : '#21324f';
        ctx.fillRect(x, y, cell, cell);
      }
    }
  }
  var gxp = ox + gx * cell + cell / 2, gyp = oy + gy * cell + cell / 2;
  drawFish(gxp, gyp + Math.sin(t * 5) * 4, cell / 14, '#ffd23f', t);
  ctx.fillStyle = 'rgba(255,210,63,.25)';
  ctx.beginPath(); ctx.arc(gxp, gyp, cell * 0.55 + Math.sin(t * 5) * 3, 0, 7); ctx.fill();
  drawPenguin(mxp - cell * 0.46, myp - cell * 0.46, cell / 12.6, { t: t, moving: moving });
  if (CFG.fog) {
    var g = ctx.createRadialGradient(mxp, myp, cell * 1.4, mxp, myp, cell * 4.6);
    g.addColorStop(0, 'rgba(4,8,18,0)');
    g.addColorStop(1, 'rgba(4,8,18,.94)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.fillStyle = 'rgba(8,14,28,.72)';
  ctx.fillRect(0, 0, W, 44);
  ctx.fillStyle = time < 10 ? '#ff6b6b' : '#ffe066';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('第 ' + level + ' 关　时间 ' + Math.ceil(time) + 's', 14, 29);
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.fillRect(14, 36, W - 28, 4);
  ctx.fillStyle = '#5ad1ff';
  ctx.fillRect(14, 36, (W - 28) * clamp(time / CFG.time, 0, 1), 4);
}

start();
state = 'menu';
setScore(0);
showOverlay(CFG.name, CFG.hint, '开始游戏');
requestAnimationFrame(loop);
</script>
</body>
</html>
