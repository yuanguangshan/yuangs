<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AI Monitoring Center</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#007AFF">
    <meta name="description" content="Real-time AI usage monitoring dashboard">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AI Monitor">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/favicon.ico">

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0A0A0F;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-hover: rgba(255, 255, 255, 0.06);
            --text-primary: #E8E8ED;
            --text-secondary: rgba(255, 255, 255, 0.5);
            --text-tertiary: rgba(255, 255, 255, 0.3);
            --accent-blue: #52ADFF;
            --accent-purple: #C080FF;
            --accent-green: #34C759;
            --accent-orange: #FF9500;
            --accent-pink: #FF2D55;
            --border-color: rgba(255, 255, 255, 0.06);
            --shadow-color: rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            padding: 0;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-x: hidden;
        }

        /* 扫描线装饰效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255, 255, 255, 0.008) 2px,
                rgba(255, 255, 255, 0.008) 4px
            );
            pointer-events: none;
            z-index: 1000;
            opacity: 0.5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 24px;
        }

        /* ===== 顶部标题区域 ===== */
        .dashboard-header {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
            padding: 32px 20px 24px;
            background: linear-gradient(180deg, rgba(82, 173, 255, 0.04) 0%, transparent 100%);
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .dashboard-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(82, 173, 255, 0.3), rgba(192, 128, 255, 0.3), transparent);
        }

        .dashboard-title {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-secondary);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .dashboard-title a {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 50%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: none;
        }

        .dashboard-subtitle {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            letter-spacing: 2px;
        }

        .dashboard-meta {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 12px;
            font-size: 0.7rem;
            color: var(--text-tertiary);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-green);
            animation: pulse 2s infinite;
        }

        /* ===== 统计卡片 ===== */
        .grid-header {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(82, 173, 255, 0.4), rgba(192, 128, 255, 0.4), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            top: -40%;
            left: -10%;
            width: 120%;
            height: 60%;
            background: radial-gradient(ellipse, rgba(82, 173, 255, 0.03) 0%, transparent 70%);
            pointer-events: none;
        }

        .stat-card:hover {
            background: var(--card-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px var(--shadow-color);
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-card-label {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-card-label .icon {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent-blue);
        }

        .stat-card.gold .stat-card-label .icon { background: var(--accent-orange); }
        .stat-card.green .stat-card-label .icon { background: var(--accent-green); }
        .stat-card.purple .stat-card-label .icon { background: var(--accent-purple); }

        .stat-card-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -1px;
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }

        .stat-card.gold .stat-card-value { color: var(--accent-orange); }
        .stat-card.green .stat-card-value { color: var(--accent-green); }
        .stat-card.purple .stat-card-value { color: var(--accent-purple); }

        /* ===== 主内容布局 ===== */
        .monitor-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .analysis-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        /* ===== 面板通用样式 ===== */
        .panel {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
        }

        .panel:hover {
            background: var(--card-hover);
        }

        .chart-container {
            height: 450px;
        }

        .panel-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-title::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 2px;
            background: var(--accent-blue);
        }

        .table-container {
            height: 450px;
            display: flex;
            flex-direction: column;
        }

        .table-container .panel-title::before { background: var(--accent-green); }

        .table-wrapper {
            overflow-y: auto;
            overflow-x: hidden;
            flex: 1;
            margin-top: 0;
        }

        .table-wrapper::-webkit-scrollbar {
            width: 4px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: transparent;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        th {
            color: var(--text-tertiary);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10;
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
        }

        tr {
            transition: background 0.2s;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .tag {
            background: rgba(82, 173, 255, 0.08);
            color: var(--accent-blue);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            display: inline-block;
            border: 1px solid rgba(82, 173, 255, 0.15);
        }

        /* ===== 最新记录 ===== */
        .latest-record {
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: rgba(52, 199, 89, 0.03);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .latest-time {
            color: var(--text-tertiary);
            font-weight: 500;
            font-size: 0.8rem;
            white-space: nowrap;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-green);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
        }

        .value-container {
            flex: 1;
            overflow: hidden;
        }

        .value {
            color: var(--text-primary);
            font-weight: 500;
            white-space: nowrap;
            display: inline-block;
            font-size: 0.85rem;
        }

        .value.marquee {
            animation: marquee 15s ease-in-out infinite;
        }

        @keyframes marquee {
            0%, 100% { transform: translateX(0); }
            25%, 75% { transform: translateX(var(--scroll-offset, -50%)); }
        }

        /* ===== 表格列特殊样式 ===== */
        #latestLogsBody td:nth-child(2) {
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-variant-numeric: tabular-nums;
        }

        #latestLogsBody td:nth-child(4) {
            color: var(--accent-green);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        #latestLogsBody td:nth-child(5) {
            color: var(--text-tertiary);
            font-size: 0.8rem;
            font-variant-numeric: tabular-nums;
        }

        .cost-cell {
            color: var(--accent-orange);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        /* ===== 底部 ===== */
        .dashboard-footer {
            margin-top: 24px;
            padding: 12px 0;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-tertiary);
            letter-spacing: 1px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* ===== 刷新按钮 ===== */
        .refresh-btn {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .refresh-btn:hover {
            background: var(--card-hover);
            color: var(--text-primary);
            border-color: rgba(82, 173, 255, 0.3);
        }

        .refresh-btn:active {
            transform: scale(0.96);
        }

        /* ===== 响应式 ===== */
        @media (max-width: 1024px) {
            .monitor-row,
            .analysis-row {
                grid-template-columns: 1fr;
            }
            .grid-header {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px 12px;
            }

            .dashboard-header {
                padding: 20px 12px 16px;
            }

            .dashboard-title {
                font-size: 0.85rem;
            }

            .grid-header {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .stat-card {
                padding: 14px 12px;
            }

            .stat-card-value {
                font-size: 1.6rem;
            }

            .chart-container,
            .table-container {
                height: 350px;
            }

            th, td {
                padding: 8px 10px;
                font-size: 0.75rem;
            }

            .panel {
                padding: 16px 12px;
            }

            .refresh-btn {
                bottom: 16px;
                right: 16px;
            }
        }

        @media (max-width: 480px) {
            .dashboard-title {
                font-size: 0.75rem;
                letter-spacing: 2px;
            }

            .stat-card-value {
                font-size: 1.4rem;
            }

            .stat-card-label {
                font-size: 0.6rem;
            }

            .chart-container,
            .table-container {
                height: 300px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- 顶部标题区域 -->
        <div class="dashboard-header">
            <div class="dashboard-title">AI 对话数据考古 · <a href="https://poe.want.biz">个人看板</a></div>
            <div class="dashboard-subtitle">REAL-TIME AI MONITORING DASHBOARD</div>
            <div class="dashboard-meta">
                <div class="meta-item">
                    <span class="meta-dot"></span>
                    <span>LIVE</span>
                </div>
                <div class="meta-item">
                    <span id="footerRenderTime">--</span>
                </div>
                <div class="meta-item">
                    <a href="https://status.yuangs.cc/" target="_blank" rel="noopener" style="color:var(--accent-blue);text-decoration:none;font-size:0.8rem;">📊 详细统计 →</a>
                </div>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="grid-header">
            <div class="stat-card">
                <div class="stat-card-label"><span class="icon"></span>累计请求</div>
                <div class="stat-card-value" id="totalRequests">-</div>
            </div>
            <div class="stat-card purple">
                <div class="stat-card-label"><span class="icon"></span>累计Tokens</div>
                <div class="stat-card-value" id="totalTokens">-</div>
            </div>
            <div class="stat-card gold">
                <div class="stat-card-label"><span class="icon"></span>预估成本</div>
                <div class="stat-card-value" id="totalCost">$ 0.0000</div>
            </div>
            <div class="stat-card green">
                <div class="stat-card-label"><span class="icon"></span>24h平均耗时</div>
                <div class="stat-card-value" id="avgPerf">- ms</div>
            </div>
        </div>

        <!-- 主监控区域 -->
        <div class="monitor-row">
            <div class="panel table-container">
                <div class="panel-title">实时流水</div>
                <div class="latest-record" id="latestRecord">
                    <span class="dot"></span>
                    <span class="latest-time" id="latestTime">--:--:--</span>
                    <div class="value-container">
                        <span class="value" id="latestRecordValue">等待数据...</span>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>应用</th>
                                <th>模型</th>
                                <th>Tokens</th>
                                <th>耗时</th>
                                <th>时间</th>
                            </tr>
                        </thead>
                        <tbody id="latestLogsBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="panel chart-container" id="perfLineChart"></div>
        </div>

        <!-- 分析区域 -->
        <div class="analysis-row">
            <div class="panel chart-container" id="stackedBarChart"></div>
            <div class="panel chart-container" id="modelPieChart"></div>
            <div class="panel table-container">
                <div class="panel-title">应用概览</div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>应用</th>
                                <th>累计请求</th>
                                <th>Tokens</th>
                                <th>成本</th>
                            </tr>
                        </thead>
                        <tbody id="summaryBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 底部信息 -->
        <div class="dashboard-footer">
            <span>RENDERED IN <span id="renderDuration">0</span>ms</span>
            <span>LAST UPDATE: <span id="lastUpdate">--:--:--</span></span>
            <span>AI MONITORING CENTER © 2026</span>
        </div>
    </div>

    <button class="refresh-btn" onclick="fetchStats()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        REFRESH
    </button>

    <script>
        let stackedBarChart, modelPieChart, perfLineChart;

        const chartTheme = {
            backgroundColor: 'transparent',
            textStyle: {
                color: 'rgba(255, 255, 255, 0.8)',
                fontFamily: '-apple-system, BlinkMacSystemFont, "SF Pro Display"'
            },
            color: ['#007AFF', '#AF52DE', '#FF2D55', '#FF9500', '#34C759', '#5AC8FA', '#FFCC00', '#FF6482'],
            grid: {
                borderWidth: 0,
                containLabel: true
            }
        };

        function initCharts() {
            stackedBarChart = echarts.init(document.getElementById('stackedBarChart'));
            modelPieChart = echarts.init(document.getElementById('modelPieChart'));
            perfLineChart = echarts.init(document.getElementById('perfLineChart'));
            
            window.addEventListener('resize', () => {
                stackedBarChart.resize();
                modelPieChart.resize();
                perfLineChart.resize();
            });
        }

        async function fetchStats() {
            const startTime = performance.now();
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                updateUI(data);
                const renderTime = Math.round(performance.now() - startTime);
                document.getElementById('renderDuration').textContent = renderTime;
                const now = new Date();
                const timeStr = now.toLocaleTimeString('zh-CN', { hour12: false });
                document.getElementById('lastUpdate').textContent = timeStr;
                document.getElementById('footerRenderTime').textContent = `RENDERED ${timeStr}`;
            } catch (e) {
                console.error('Data error:', e);
            }
        }

        function getDisplayName(name) {
            const map = {
                'shici': '诗词雅苑',
                'poe-app': 'Poe助手',
                'music': '广山音乐',
                'npm_yuangs': 'npm',
                 'default-gateway': 'default',
                'dictionary': 'KK词典',
                'chatbox': 'ChatBox'
            };
            return map[name] || name;
        }

        function updateUI(data) {
            const totalTokens = data.summary.reduce((s, i) => s + i.total_tokens, 0);
            const totalRequests = data.summary.reduce((s, i) => s + i.count, 0);
            const totalCost = data.summary.reduce((s, i) => s + parseFloat(i.estimated_cost || 0), 0);
            const avgTime = data.performance.length > 0 ?
                (data.performance.reduce((s, i) => s + i.avg_duration, 0) / data.performance.length).toFixed(0) : 0;

            document.getElementById('totalRequests').innerText = totalRequests.toLocaleString();
            document.getElementById('totalTokens').innerText = totalTokens.toLocaleString();
            document.getElementById('totalCost').innerText = `$ ${totalCost.toFixed(4)}`;
            document.getElementById('avgPerf').innerText = `${avgTime} ms`;

            document.getElementById('summaryBody').innerHTML = data.summary.map(item => `
                <tr>
                    <td><span class="tag">${getDisplayName(item.app_name)}</span></td>
                    <td>${item.count.toLocaleString()}</td>
                    <td>${item.total_tokens.toLocaleString()}</td>
                    <td class="cost-cell">$ ${parseFloat(item.estimated_cost).toFixed(4)}</td>
                </tr>
            `).join('');

            // 更新实时流水表格
            document.getElementById('latestLogsBody').innerHTML = data.latest.map(item => `
                <tr>
                    <td><span class="tag">${getDisplayName(item.app_name)}</span></td>
                    <td>${item.model_name}</td>
                    <td>${item.tokens.toLocaleString()}</td>
                    <td>${(item.duration / 1000).toFixed(2)}s</td>
                    <td>${item.created_at.split(' ')[1]}</td>
                </tr>
            `).join('');

            // 更新最新记录显示
            if (data.latest && data.latest.length > 0) {
                const latest = data.latest[0]; // 最后一条记录（假设数组是按时间倒序排列）
                const time = latest.created_at.split(' ')[1]; // 提取时间部分
                const latestRecordText = `[${getDisplayName(latest.app_name)}] 使用了💡 ${latest.model_name} 模型，耗时🕜 ${(latest.duration / 1000).toFixed(2)} 秒`;
                const latestRecordElement = document.getElementById('latestRecordValue');

                // 如果数据没变，就不触发后续的 DOM 操作和动画重算
                if (latestRecordElement.textContent === latestRecordText) {
                    // 数据没有变化，跳过后续的 DOM 操作和动画重算
                } else {
                    latestRecordElement.textContent = latestRecordText;

                    // 设置时间显示
                    const latestTimeElement = document.getElementById('latestTime');
                    latestTimeElement.textContent = time;

                    // 检查是否需要滚动 - 在下一个渲染周期执行以确保DOM更新完成
                    setTimeout(() => {
                        const container = latestRecordElement.parentElement;
                        if (latestRecordElement.scrollWidth > container.clientWidth) {
                            // 动态计算偏移量并应用到样式中
                            const offset = (latestRecordElement.scrollWidth - container.clientWidth);
                            latestRecordElement.style.animation = `marquee 15s ease-in-out infinite`;
                            // 使用CSS自定义属性来传递偏移量
                            latestRecordElement.style.setProperty('--scroll-offset', `-${offset}px`);
                            latestRecordElement.classList.add('marquee');
                        } else {
                            latestRecordElement.classList.remove('marquee');
                            latestRecordElement.style.animation = '';
                        }
                    }, 0);
                }
            } else {
                const latestRecordElement = document.getElementById('latestRecordValue');
                if (latestRecordElement.textContent === '暂无数据') {
                    // 数据没有变化，跳过后续的 DOM 操作和动画重算
                } else {
                    latestRecordElement.textContent = '暂无数据';
                    latestRecordElement.classList.remove('marquee');
                    latestRecordElement.style.animation = '';
                    document.getElementById('latestTime').textContent = '--:--:--';
                }
            }

            renderStackedBar(data.heatmap);
            renderModelPie(data.models);
            renderPerfLine(data.performance);
        }

        function renderStackedBar(history) {
            const dates = [...new Set(history.map(d => d.date))];
            const appNames = [...new Set(history.map(d => d.app_name))];

            const series = appNames.map(appName => ({
                name: getDisplayName(appName),
                type: 'bar',
                stack: 'total',
                emphasis: {
                    focus: 'series',
                    itemStyle: {
                        shadowBlur: 10,
                        shadowColor: 'rgba(0, 0, 0, 0.5)'
                    }
                },
                itemStyle: {
                    borderRadius: [4, 4, 0, 0]
                },
                data: dates.map(date => {
                    const record = history.find(h => h.date === date && h.app_name === appName);
                    return record ? record.daily_tokens : 0;
                })
            }));

            stackedBarChart.setOption({
                ...chartTheme,
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    },
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    borderColor: 'rgba(255, 255, 255, 0.2)',
                    textStyle: {
                        color: '#ffffff'
                    }
                },
                legend: {
                    textStyle: {
                        color: 'rgba(255, 255, 255, 0.6)'
                    },
                    bottom: 15,
                    icon: 'circle'
                },
                grid: {
                    top: '20%',
                    bottom: '25%',
                    left: '5%',
                    right: '5%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: dates,
                    axisLine: {
                        lineStyle: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        }
                    },
                    axisLabel: {
                        color: 'rgba(255, 255, 255, 0.6)'
                    }
                },
                yAxis: {
                    type: 'value',
                    splitLine: {
                        lineStyle: {
                            color: 'rgba(255, 255, 255, 0.05)'
                        }
                    },
                    axisLabel: {
                        color: 'rgba(255, 255, 255, 0.6)'
                    }
                },
                series: series
            }, true);
        }

        function renderModelPie(models) {
            modelPieChart.setOption({
                ...chartTheme,
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}: {c} ({d}%)',
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    borderColor: 'rgba(255, 255, 255, 0.2)',
                    textStyle: {
                        color: '#ffffff'
                    }
                },
                series: [{
                    type: 'pie',
                    radius: ['35%', '65%'],
                    center: ['50%', '50%'],
                    avoidLabelOverlap: false,
                    itemStyle: {
                        borderRadius: 8,
                        borderColor: '#000000',
                        borderWidth: 3
                    },
                    label: {
                        show: true,
                        formatter: '{b}\n{d}%',
                        color: 'rgba(255, 255, 255, 0.8)',
                        fontSize: 11,
                        fontWeight: 500
                    },
                    labelLine: {
                        show: true,
                        lineStyle: {
                            color: 'rgba(255, 255, 255, 0.3)'
                        }
                    },
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 20,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    },
                    data: models.map(m => ({
                        name: m.model_name,
                        value: m.count
                    }))
                }]
            });
        }

        function renderPerfLine(perf) {
            perfLineChart.setOption({
                ...chartTheme,
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    borderColor: 'rgba(255, 255, 255, 0.2)',
                    textStyle: {
                        color: '#ffffff'
                    }
                },
                grid: {
                    top: '25%',
                    bottom: '10%',
                    left: '8%',
                    right: '5%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: perf.map(p => p.hour + 'h'),
                    boundaryGap: false,
                    axisLine: {
                        lineStyle: {
                            color: 'rgba(255, 255, 255, 0.1)'
                        }
                    },
                    axisLabel: {
                        color: 'rgba(255, 255, 255, 0.6)'
                    }
                },
                yAxis: {
                    type: 'value',
                    name: 'ms',
                    nameTextStyle: {
                        color: 'rgba(255, 255, 255, 0.6)'
                    },
                    splitLine: {
                        lineStyle: {
                            color: 'rgba(255, 255, 255, 0.05)'
                        }
                    },
                    axisLabel: {
                        color: 'rgba(255, 255, 255, 0.6)'
                    }
                },
                series: [{
                    data: perf.map(p => Math.round(p.avg_duration)),
                    type: 'line',
                    smooth: true,
                    symbol: 'circle',
                    symbolSize: 6,
                    lineStyle: {
                        color: '#34C759',
                        width: 3
                    },
                    itemStyle: {
                        color: '#34C759',
                        borderWidth: 2,
                        borderColor: '#000000'
                    },
                    areaStyle: {
                        color: {
                            type: 'linear',
                            x: 0,
                            y: 0,
                            x2: 0,
                            y2: 1,
                            colorStops: [{
                                offset: 0,
                                color: 'rgba(52, 199, 89, 0.3)'
                            }, {
                                offset: 1,
                                color: 'rgba(52, 199, 89, 0.05)'
                            }]
                        }
                    },
                    emphasis: {
                        itemStyle: {
                            shadowBlur: 10,
                            shadowColor: 'rgba(52, 199, 89, 0.5)'
                        }
                    }
                }]
            });
        }

        // 自动刷新最新数据
        function startAutoRefresh() {
            // 每5秒刷新一次
            setInterval(fetchStats, 5000);
        }

        initCharts();
        fetchStats();
        startAutoRefresh();
    </script>

    <!-- Register Service Worker for PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(function(error) {
                        console.log('ServiceWorker registration failed: ', error);
                    });
            });
        }
    </script>
